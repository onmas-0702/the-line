<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34508f"/>
      <stop offset="1" stop-color="#16244f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#f6c65b"/>
